<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 240" fill="none">
  <!-- Truck Cab Top View -->
  <rect x="14" y="180" width="42" height="52" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <!-- Windshield Curved Glass -->
  <path d="M18 214 Q35 224 52 214 L50 202 Q35 210 20 202 Z" fill="#93C5FD" stroke="#1E3A8A" stroke-width="1.5"/>
  <!-- Roof Spoiler / Air Deflector -->
  <rect x="18" y="184" width="34" height="18" rx="2" fill="#0F172A"/>
  <!-- Side Mirrors -->
  <rect x="8" y="212" width="6" height="12" rx="2" fill="#0F172A"/>
  <rect x="56" y="212" width="6" height="12" rx="2" fill="#0F172A"/>
  <!-- GoShipping Red Brand Accent on Cab Roof -->
  <rect x="22" y="188" width="26" height="4" fill="#EA1D2C"/>

  <!-- Fifth Wheel Coupling Joint -->
  <rect x="28" y="168" width="14" height="14" rx="3" fill="#334155"/>

  <!-- 40ft Shipping Container Top View (White Corrugated Metal Roof) -->
  <rect x="12" y="10" width="46" height="164" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Corner Castings (4 corners) -->
  <rect x="12" y="10" width="6" height="8" fill="#475569"/>
  <rect x="52" y="10" width="6" height="8" fill="#475569"/>
  <rect x="12" y="166" width="6" height="8" fill="#475569"/>
  <rect x="52" y="166" width="6" height="8" fill="#475569"/>

  <!-- Transverse Roof Corrugation Ribs -->
  <g stroke="#E2E8F0" stroke-width="1.5">
    <line x1="14" y1="22" x2="56" y2="22"/><line x1="14" y1="28" x2="56" y2="28"/><line x1="14" y1="34" x2="56" y2="34"/><line x1="14" y1="40" x2="56" y2="40"/><line x1="14" y1="46" x2="56" y2="46"/><line x1="14" y1="52" x2="56" y2="52"/><line x1="14" y1="58" x2="56" y2="58"/><line x1="14" y1="64" x2="56" y2="64"/><line x1="14" y1="70" x2="56" y2="70"/><line x1="14" y1="76" x2="56" y2="76"/><line x1="14" y1="82" x2="56" y2="82"/><line x1="14" y1="88" x2="56" y2="88"/><line x1="14" y1="94" x2="56" y2="94"/><line x1="14" y1="100" x2="56" y2="100"/><line x1="14" y1="106" x2="56" y2="106"/><line x1="14" y1="112" x2="56" y2="112"/><line x1="14" y1="118" x2="56" y2="118"/><line x1="14" y1="124" x2="56" y2="124"/><line x1="14" y1="130" x2="56" y2="130"/><line x1="14" y1="136" x2="56" y2="136"/><line x1="14" y1="142" x2="56" y2="142"/><line x1="14" y1="148" x2="56" y2="148"/><line x1="14" y1="154" x2="56" y2="154"/><line x1="14" y1="160" x2="56" y2="160"/>
  </g>

  <!-- GoShipping Stenciled Logo on Container Roof -->
  <text x="35" y="94" fill="#EA1D2C" font-family="'Manrope', sans-serif" font-weight="900" font-size="7" text-anchor="middle" letter-spacing="1" transform="rotate(90 35 94)">GOSHIPPING</text>
</svg>