<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 540" width="110" height="540">
  <defs>
    <!-- Drop shadow for 3D realism -->
    <filter id="truckShadowVert" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <!-- Cab gradient (vertical down) -->
    <linearGradient id="cabGradVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <!-- Windshield gradient -->
    <linearGradient id="windshieldGradVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- Container roof gradient (transverse) -->
    <linearGradient id="containerGradVert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

