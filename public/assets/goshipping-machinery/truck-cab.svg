<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" fill="none">
  <defs>
    <linearGradient id="cab_body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11181E"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="windshield_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Aerodynamic Roof Fairing / Deflector -->
  <path d="M20 60 Q80 20 180 20 Q240 20 260 50 L260 80 L20 80 Z" fill="#11181E" stroke="#0F172A" stroke-width="2"/>
  <!-- Roof Marker Lights -->
  <rect x="80" y="24" width="10" height="4" rx="1" fill="#F59E0B"/>
  <rect x="110" y="22" width="10" height="4" rx="1" fill="#F59E0B"/>
  <rect x="140" y="22" width="10" height="4" rx="1" fill="#F59E0B"/>
  <rect x="170" y="24" width="10" height="4" rx="1" fill="#F59E0B"/>

  <!-- Main Cab Structure -->
  <path d="M20 80 L20 250 L280 250 L280 180 L260 110 L250 80 Z" fill="url(#cab_body)" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Front Windshield & Side Windows -->
  <path d="M170 85 L245 85 L255 140 L170 140 Z" fill="url(#windshield_glass)" stroke="#0F172A" stroke-width="2"/>
  <path d="M70 85 L160 85 L160 140 L70 140 Z" fill="url(#windshield_glass)" stroke="#0F172A" stroke-width="2"/>

  <!-- GoShipping Crimson Accent Stripe -->
  <path d="M20 155 L260 155 L265 175 L20 175 Z" fill="#EA1D2C"/>
  <text x="130" y="170" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-weight="900" font-size="12" letter-spacing="1">GOSHIPPING EXPRESS</text>

  <!-- Front Chrome Grille -->
  <rect x="230" y="185" width="45" height="50" rx="3" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="235" y1="195" x2="270" y2="195" stroke="#94A3B8" stroke-width="2"/>
  <line x1="235" y1="205" x2="270" y2="205" stroke="#94A3B8" stroke-width="2"/>
  <line x1="235" y1="215" x2="270" y2="215" stroke="#94A3B8" stroke-width="2"/>
  <line x1="235" y1="225" x2="270" y2="225" stroke="#94A3B8" stroke-width="2"/>

  <!-- High-Power LED Headlight Assembly -->
  <path d="M260 220 L276 220 L274 240 L258 240 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
  <rect x="262" y="222" width="10" height="8" fill="#FFFFFF"/>

  <!-- Side View Mirror -->
  <rect x="252" y="100" width="12" height="36" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <line x1="242" y1="108" x2="252" y2="108" stroke="#334155" stroke-width="2"/>
  <line x1="244" y1="128" x2="252" y2="128" stroke="#334155" stroke-width="2"/>

  <!-- Side Access Steps & Fuel Tank -->
  <rect x="70" y="215" width="65" height="30" rx="4" fill="#64748B" stroke="#334155" stroke-width="1.5"/>
  <line x1="45" y1="225" x2="65" y2="225" stroke="#CBD5E1" stroke-width="2.5"/>
  <line x1="45" y1="240" x2="65" y2="240" stroke="#CBD5E1" stroke-width="2.5"/>

  <!-- Front Wheel Fender -->
  <path d="M170 250 Q220 190 270 250 Z" fill="#0F172A"/>
</svg>